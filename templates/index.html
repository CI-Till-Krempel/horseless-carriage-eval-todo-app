<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/add_list" method="POST">
        <input type="text" name="title" placeholder="New List Title" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for lst in lists %}
            <li>
                <strong>{{ lst.title }}</strong>
                <form action="/add_task/{{ lst.id }}" method="POST" style="display:inline;">
                    <input type="text" name="description" placeholder="New Task" required>
                    <button type="submit">Add Task</button>
                </form>
                <ul>
                    {% for task in lst.tasks %}
                        <li>{{ task.description }}</li>
                    {% endfor %}
                </ul>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
