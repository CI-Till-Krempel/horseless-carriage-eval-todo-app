<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>

    <ul>
        {% for lst in lists %}
        <li>
            <strong>{{ lst.name }}</strong>
            <form action="/lists/{{ lst.id }}/delete" method="POST" style="display:inline;">
                <button type="submit">Delete List</button>
            </form>

            <form action="/lists/{{ lst.id }}/tasks" method="POST">
                <input type="text" name="content" placeholder="New Task Description" required>
                <button type="submit">Add Task</button>
            </form>

            <ul>
                {% for task in tasks %}
                    {% if task.list_id == lst.id %}
                    <li>
                        <span style="{% if task.completed %}text-decoration: line-through;{% endif %}">{{ task.content }}</span>
                        <form action="/tasks/{{ task.id }}/toggle" method="POST" style="display:inline;">
                            <button type="submit">Toggle</button>
                        </form>
                        <form action="/tasks/{{ task.id }}/delete" method="POST" style="display:inline;">
                            <button type="submit">Delete</button>
                        </form>
                    </li>
                    {% endif %}
                {% endfor %}
            </ul>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
