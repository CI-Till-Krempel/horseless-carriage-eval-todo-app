<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Web App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        form { margin-bottom: 20px; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .completed { text-decoration: line-through; color: #888; }
        .list-section { margin-bottom: 30px; border: 1px solid #ddd; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do Lists</h1>
        
        <form action="/lists" method="POST">
            <input type="text" name="name" placeholder="New List Name" required>
            <button type="submit">Create List</button>
        </form>

        {% for list_id, lst in lists.items() %}
        <div class="list-section">
            <h2>{{ lst.name }}</h2>
            
            <form action="/lists/{{ list_id }}/tasks" method="POST">
                <input type="text" name="title" placeholder="New Task Description" required>
                <button type="submit">Add Task</button>
            </form>

            <ul>
                {% for task in lst.tasks %}
                <li>
                    <span class="{% if task.completed %}completed{% endif %}">{{ task.title }}</span>
                    <form action="/lists/{{ list_id }}/tasks/{{ task.id }}/toggle" method="POST" style="margin:0;">
                        <button type="submit">{% if task.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}</button>
                    </form>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</body>
</html>
