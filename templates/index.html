<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for list_id, lst in lists.items() %}
            <li>
                <strong>{{ lst.name }}</strong>
                <ul>
                    {% for task in lst.tasks %}
                        <li>{{ task.title }}</li>
                    {% endfor %}
                </ul>
                <form action="/lists/{{ list_id }}/tasks" method="POST">
                    <input type="text" name="title" placeholder="New Task Title" required>
                    <button type="submit">Add Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
