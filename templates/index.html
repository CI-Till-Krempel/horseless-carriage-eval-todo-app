<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do Lists</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form method="POST">
        <input type="text" name="list_name" placeholder="New list name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for list in lists %}
            <li>{{ list.name }}</li>
        {% endfor %}
    </ul>
</body>
</html>
