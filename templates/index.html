<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do Lists</h1>
        </header>

        <section class="create-list-section">
            <form action="/lists" method="POST">
                <input type="text" name="name" placeholder="New list name..." required autocomplete="off">
                <button type="submit" class="btn primary">Create List</button>
            </form>
        </section>

        <main class="lists-container">
            {% if not lists %}
                <p class="empty-state">No to-do lists yet. Create one above to get started!</p>
            {% endif %}

            {% for list_id, lst in lists.items() %}
                <div class="todo-list-card">
                    <div class="list-header">
                        <h2>{{ lst.name }}</h2>
                        <form action="/lists/{{ list_id }}/delete" method="POST" style="display:inline;">
                            <button type="submit" class="btn danger small">Delete List</button>
                        </form>
                    </div>

                    <ul class="task-list">
                        {% for task in lst.tasks %}
                            <li class="task-item {% if task.completed %}completed{% endif %}">
                                <form action="/lists/{{ list_id }}/tasks/{{ task.id }}/toggle" method="POST" style="display:inline;">
                                    <button type="submit" class="btn-toggle" title="Toggle complete">
                                        {% if task.completed %}☑{% else %}☐{% endif %}
                                    </button>
                                </form>
                                <span class="task-text">{{ task.text }}</span>
                                <form action="/lists/{{ list_id }}/tasks/{{ task.id }}/delete" method="POST" style="display:inline;">
                                    <button type="submit" class="btn danger small" title="Delete task">×</button>
                                </form>
                            </li>
                        {% else %}
                            <li class="empty-tasks">No tasks in this list yet.</li>
                        {% endfor %}
                    </ul>

                    <form action="/lists/{{ list_id }}/tasks" method="POST" class="add-task-form">
                        <input type="text" name="text" placeholder="Add a new task..." required autocomplete="off">
                        <button type="submit" class="btn secondary">Add Task</button>
                    </form>
                </div>
            {% endfor %}
        </main>
    </div>
</body>
</html>
