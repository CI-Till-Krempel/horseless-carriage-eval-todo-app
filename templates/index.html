<!doctype html>
<title>To-Do App</title>
<h1>To-Do Lists</h1>
<form action="/lists" method="post">
  <input type="text" name="name" placeholder="New list name" required>
  <button type="submit">Create List</button>
</form>
<ul>
  {% for name, tasks in lists.items() %}
    <li>
      <strong>{{ name }}</strong>
      <form action="/lists/{{ name }}/tasks" method="post" style="display:inline;">
        <input type="text" name="task" placeholder="New task description" required>
        <button type="submit">Add Task</button>
      </form>
      <ul>
        {% for task in tasks %}
          <li>{{ task.description }}</li>
        {% endfor %}
      </ul>
    </li>
  {% endfor %}
</ul>
