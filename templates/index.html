<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">To-Do List App</h1>
            <p class="text-gray-600">Organize your lists and tasks efficiently.</p>
        </header>

        <!-- Create List Form -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-800">Create New List</h2>
            <form id="create-list-form" class="flex gap-4">
                <input type="text" id="list-name-input" placeholder="List Name..." required
                       class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                    Create List
                </button>
            </form>
        </div>

        <!-- Lists Container -->
        <div id="lists-container" class="space-y-6">
            <!-- Dynamic Lists will appear here -->
        </div>
    </div>

    <script>
        async function fetchLists() {
            try {
                const res = await fetch('/api/lists');
                const lists = await res.json();
                renderLists(lists);
            } catch (err) {
                console.error('Failed to fetch lists', err);
            }
        }

        function renderLists(lists) {
            const container = document.getElementById('lists-container');
            container.innerHTML = '';

            if (lists.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 bg-white p-6 rounded-lg shadow">No to-do lists yet. Create one above!</p>';
                return;
            }

            lists.forEach(list => {
                const listEl = document.createElement('div');
                listEl.className = 'bg-white rounded-lg shadow p-6';

                let tasksHtml = '';
                if (list.tasks.length === 0) {
                    tasksHtml = '<p class="text-gray-400 text-sm italic mb-4">No tasks in this list yet.</p>';
                } else {
                    tasksHtml = '<ul class="space-y-2 mb-4">';
                    list.tasks.forEach(task => {
                        tasksHtml += `
                            <li class="flex items-center justify-between bg-gray-50 px-4 py-2 rounded border border-gray-200">
                                <div class="flex items-center gap-3">
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} 
                                           onchange="toggleTask('${list.id}', '${task.id}')"
                                           class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                                    <span class="${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${escapeHtml(task.description)}</span>
                                </div>
                                <button onclick="deleteTask('${list.id}', '${task.id}')" class="text-red-500 hover:text-red-700 text-sm">Delete</button>
                            </li>
                        `;
                    });
                    tasksHtml += '</ul>';
                }

                listEl.innerHTML = `
                    <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                        <h3 class="text-2xl font-bold text-gray-800">${escapeHtml(list.name)}</h3>
                        <button onclick="deleteList('${list.id}')" class="text-red-600 hover:text-red-800 text-sm font-medium">Delete List</button>
                    </div>
                    ${tasksHtml}
                    <form onsubmit="addTask(event, '${list.id}')" class="flex gap-2">
                        <input type="text" id="task-input-${list.id}" placeholder="New task description..." required
                               class="flex-1 border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="submit" class="bg-gray-800 text-white px-4 py-1.5 rounded text-sm hover:bg-gray-900 transition">Add Task</button>
                    </form>
                `;
                container.appendChild(listEl);
            });
        }

        async function createList(e) {
            e.preventDefault();
            const input = document.getElementById('list-name-input');
            const name = input.value.trim();
            if (!name) return;

            await fetch('/api/lists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            input.value = '';
            fetchLists();
        }

        async function deleteList(listId) {
            if (!confirm('Are you sure you want to delete this list and all its tasks?')) return;
            await fetch(`/api/lists/${listId}`, { method: 'DELETE' });
            fetchLists();
        }

        async function addTask(e, listId) {
            e.preventDefault();
            const input = document.getElementById(`task-input-${listId}`);
            const description = input.value.trim();
            if (!description) return;

            await fetch(`/api/lists/${listId}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description })
            });
            input.value = '';
            fetchLists();
        }

        async function deleteTask(listId, taskId) {
            await fetch(`/api/lists/${listId}/tasks/${taskId}`, { method: 'DELETE' });
            fetchLists();
        }

        async function toggleTask(listId, taskId) {
            await fetch(`/api/lists/${listId}/tasks/${taskId}/toggle`, { method: 'PATCH' });
            fetchLists();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        document.getElementById('create-list-form').addEventListener('submit', createList);
        fetchLists();
    </script>
</body>
</html>
