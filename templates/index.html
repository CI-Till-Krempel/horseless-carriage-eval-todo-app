<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>

    <hr>

    <ul>
    {% for lst in lists %}
        <li>
            <strong>{{ lst.name }}</strong>
            <ul>
                {% for task in lst.tasks %}
                    <li>{{ task.text }}</li>
                {% endfor %}
            </ul>
            <form action="/lists/{{ lst.id }}/tasks" method="POST" style="margin-top: 5px;">
                <input type="text" name="text" placeholder="New Task Description" required>
                <button type="submit">Add Task</button>
            </form>
        </li>
    {% endfor %}
    </ul>
</body>
</html>
