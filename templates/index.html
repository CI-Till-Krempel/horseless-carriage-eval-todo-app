<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">My To-Do Lists</h1>
        
        <form action="{{ url_for('add_list') }}" method="POST" class="mb-4 input-group">
            <input type="text" name="name" class="form-control" placeholder="New List Name" required>
            <button class="btn btn-primary" type="submit">Create List</button>
        </form>

        {% for lst in lists %}
        <div class="card mb-4 shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h3 class="h5 mb-0">{{ lst.name }}</h3>
                <form action="{{ url_for('delete_list', list_id=lst.id) }}" method="POST" class="m-0">
                    <button class="btn btn-sm btn-danger" type="submit">Delete List</button>
                </form>
            </div>
            <div class="card-body">
                <ul class="list-group mb-3">
                    {% for task in lst.tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="POST" class="d-inline">
                                <button class="btn btn-sm btn-outline-secondary me-2" type="submit">
                                    {{ 'Undo' if task.completed else 'Complete' }}
                                </button>
                            </form>
                            <span class="{{ 'completed' if task.completed else '' }}">{{ task.description }}</span>
                        </div>
                        <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST" class="m-0">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </li>
                    {% else %}
                    <li class="list-group-item text-muted">No tasks yet.</li>
                    {% endfor %}
                </ul>

                <form action="{{ url_for('add_task', list_id=lst.id) }}" method="POST" class="input-group">
                    <input type="text" name="description" class="form-control" placeholder="New Task Description" required>
                    <button class="btn btn-success" type="submit">Add Task</button>
                </form>
            </div>
        </div>
        {% else %}
        <p class="text-muted">No to-do lists created yet. Create one above!</p>
        {% endfor %}
    </div>
</body>
</html>
