<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-Do List App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>

    <div id="lists">
        {% for lst in lists %}
            <div class="todo-list" data-list-id="{{ lst.id }}">
                <h2>{{ lst.name }}</h2>
            </div>
        {% endfor %}
    </div>
</body>
</html>
