<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-Do List App</title>
    <style>
        .completed { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New list name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for lst in lists %}
            <li>
                <strong>{{ lst.name }}</strong>
                <form action="/lists/{{ lst.id }}/tasks" method="POST" style="display:inline; margin-left: 10px;">
                    <input type="text" name="content" placeholder="New task description" required>
                    <button type="submit">Add Task</button>
                </form>
                <ul>
                    {% for task in lst.tasks %}
                        <li>
                            <form action="/lists/{{ lst.id }}/tasks/{{ task.id }}/toggle" method="POST" style="display:inline;">
                                <button type="submit">{% if task.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}</button>
                            </form>
                            <span class="{% if task.completed %}completed{% endif %}">{{ task.content }}</span>
                            <form action="/lists/{{ lst.id }}/tasks/{{ task.id }}/delete" method="POST" style="display:inline;">
                                <button type="submit">Delete</button>
                            </form>
                        </li>
                    {% endfor %}
                </ul>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
