<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Web App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>To-Do List App</h1>

        <!-- Create List Form -->
        <form action="{{ url_for('create_list') }}" method="POST" class="list-form">
            <input type="text" name="name" placeholder="New List Name..." required>
            <button type="submit">Create List</button>
        </form>

        <!-- Lists Display -->
        <div class="lists-container">
            {% for list_id, lst in lists.items() %}
            <div class="todo-list-card">
                <div class="list-header">
                    <h2>{{ lst.name }}</h2>
                    <form action="{{ url_for('delete_list', list_id=lst.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="delete-btn">Delete List</button>
                    </form>
                </div>

                <!-- Add Task Form -->
                <form action="{{ url_for('add_task', list_id=lst.id) }}" method="POST" class="task-form">
                    <input type="text" name="content" placeholder="New task description..." required>
                    <button type="submit">Add Task</button>
                </form>

                <!-- Tasks List -->
                <ul class="task-list">
                    {% for task in lst.tasks %}
                    <li class="task-item {% if task.completed %}completed{% endif %}">
                        <form action="{{ url_for('toggle_task', list_id=lst.id, task_id=task.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="toggle-btn">
                                {% if task.completed %}✓{% else %}○{% endif %}
                            </button>
                        </form>
                        <span class="task-text">{{ task.content }}</span>
                        <form action="{{ url_for('delete_task', list_id=lst.id, task_id=task.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="delete-task-btn">Delete</button>
                        </form>
                    </li>
                    {% endfor %}
                </ul>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
