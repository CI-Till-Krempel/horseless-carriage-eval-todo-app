<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do Lists</title>
</head>
<body>
    <h1>My To-Do Lists</h1>
    <form action="/create_list" method="POST">
        <input type="text" name="list_name" placeholder="New list name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for list in lists %}
            <li>
                <strong>{{ list.name }}</strong>
                <ul>
                    {% for task in list.tasks %}
                        <li>{{ task.text }}</li>
                    {% endfor %}
                </ul>
                <form action="/add_task/{{ list.id }}" method="POST">
                    <input type="text" name="task_text" placeholder="New task" required>
                    <button type="submit">Add Task</button>
                </form>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
