<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">To-Do Lists</h1>
        
        <!-- Create List Form -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form action="/lists" method="POST" class="row g-3">
                    <div class="col-auto flex-grow-1">
                        <input type="text" name="name" class="form-control" placeholder="New List Name" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Create List</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lists Overview -->
        {% for list_id, lst in lists.items() %}
        <div class="card mb-4 shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">{{ lst.name }}</h5>
                <form action="/lists/{{ list_id }}/delete" method="POST" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete List</button>
                </form>
            </div>
            <div class="card-body">
                <!-- Add Task Form -->
                <form action="/lists/{{ list_id }}/tasks" method="POST" class="row g-2 mb-3">
                    <div class="col">
                        <input type="text" name="text" class="form-control form-control-sm" placeholder="New Task Description" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-sm btn-secondary">Add Task</button>
                    </div>
                </form>

                <!-- Tasks List -->
                <ul class="list-group">
                    {% for task in lst.tasks %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="{% if task.completed %}completed{% endif %}">{{ task.text }}</span>
                        <div class="btn-group" role="group">
                            <form action="/lists/{{ list_id }}/tasks/{{ task.id }}/toggle" method="POST" class="m-0 me-1">
                                <button type="submit" class="btn btn-sm {% if task.completed %}btn-outline-secondary{% else %}btn-outline-success{% endif %}">
                                    {% if task.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}
                                </button>
                            </form>
                            <form action="/lists/{{ list_id }}/tasks/{{ task.id }}/delete" method="POST" class="m-0">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </div>
                    </li>
                    {% else %}
                    <li class="list-group-item text-muted">No tasks in this list yet.</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% else %}
        <div class="alert alert-info">No to-do lists created yet. Create one above!</div>
        {% endfor %}
    </div>
</body>
</html>
