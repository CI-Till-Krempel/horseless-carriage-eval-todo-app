<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .completed { text-decoration: line-through; color: gray; }
        .list-container { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>To-Do Lists</h1>
    
    <form action="{{ url_for('create_list') }}" method="POST">
        <input type="text" name="title" placeholder="New List Title" required>
        <button type="submit">Create List</button>
    </form>

    <hr>

    {% for todo_list in lists %}
    <div class="list-container">
        <h2>{{ todo_list.title }}</h2>
        
        <ul>
            {% for task in todo_list.tasks %}
            <li>
                <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="POST" style="display:inline;">
                    <button type="submit" style="background:none;border:none;color:blue;cursor:pointer;padding:0;font:inherit;">
                        <span class="{% if task.completed %}completed{% endif %}">{{ task.title }}</span>
                    </button>
                </form>
            </li>
            {% endfor %}
        </ul>

        <form action="{{ url_for('add_task', list_id=todo_list.id) }}" method="POST">
            <input type="text" name="title" placeholder="New Task Title" required>
            <button type="submit">Add Task</button>
        </form>
    </div>
    {% endfor %}
</body>
</html>
