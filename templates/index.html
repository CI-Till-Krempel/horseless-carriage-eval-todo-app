<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="List Name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for name, lst in todo_lists.items() %}
            <li>{{ name }}</li>
        {% endfor %}
    </ul>
</body>
</html>
