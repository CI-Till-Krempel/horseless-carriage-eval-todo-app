<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 600px; margin: auto; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; background: #f4f4f4; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { padding: 6px; width: 70%; }
        button { padding: 6px 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do Lists</h1>
        <form action="/lists" method="POST">
            <input type="text" name="name" placeholder="New list name..." required>
            <button type="submit">Create List</button>
        </form>
        <h2>All Lists</h2>
        <ul>
            {% for lst in todo_lists %}
                <li>
                    <span>{{ lst.name }}</span>
                </li>
            {% else %}
                <li>No to-do lists yet. Create one above!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
