<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">My To-Do Lists</h1>

        <!-- Create List Form -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="{{ url_for('create_list') }}" method="POST" class="row g-3">
                    <div class="col-auto flex-grow-1">
                        <input type="text" name="name" class="form-control" placeholder="New List Name..." required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Create List</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Display Lists and Tasks -->
        {% if lists %}
            <div class="row">
                {% for lst in lists %}
                    <div class="col-md-6 mb-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-header d-flex justify-content-between align-items-center bg-white">
                                <h5 class="mb-0 fw-bold">{{ lst.name }}</h5>
                                <form action="{{ url_for('delete_list', list_id=lst.id) }}" method="POST" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete List</button>
                                </form>
                            </div>
                            <div class="card-body">
                                <!-- Add Task Form -->
                                <form action="{{ url_for('create_task', list_id=lst.id) }}" method="POST" class="input-group mb-3">
                                    <input type="text" name="title" class="form-control" placeholder="New task description..." required>
                                    <button class="btn btn-outline-secondary" type="submit">Add Task</button>
                                </form>

                                <!-- Task List -->
                                {% if lst.tasks %}
                                    <ul class="list-group">
                                        {% for task in lst.tasks %}
                                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                                <span class="{% if task.complete %}completed{% endif %}">{{ task.title }}</span>
                                                <div class="btn-group" role="group">
                                                    <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="POST" class="d-inline me-1">
                                                        <button type="submit" class="btn btn-sm {% if task.complete %}btn-outline-secondary{% else %}btn-outline-success{% endif %}">
                                                            {% if task.complete %}Mark Incomplete{% else %}Mark Complete{% endif %}
                                                        </button>
                                                    </form>
                                                    <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                                    </form>
                                                </div>
                                            </li>
                                        {% endfor %}
                                    </ul>
                                {% else %}
                                    <p class="text-muted fst-italic mb-0">No tasks in this list yet.</p>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="alert alert-info text-center" role="alert">
                No to-do lists found. Create your first list above!
            </div>
        {% endif %}
    </div>
</body>
</html>
