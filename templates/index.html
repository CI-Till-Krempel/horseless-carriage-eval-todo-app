<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>To-Do Lists</h1>
        
        <form action="/lists" method="POST" class="list-form">
            <input type="text" name="name" placeholder="New List Name" required>
            <button type="submit">Create List</button>
        </form>

        <div class="lists-container">
            {% for list in lists %}
            <div class="todo-list-card">
                <div class="list-header">
                    <h2>{{ list.name }}</h2>
                    <form action="/lists/{{ list.id }}/delete" method="POST" style="display:inline;">
                        <button type="submit" class="delete-btn">Delete List</button>
                    </form>
                </div>

                <ul class="task-list">
                    {% for task in list.tasks %}
                    <li class="task-item {% if task.completed %}completed{% endif %}">
                        <form action="/tasks/{{ task.id }}/toggle" method="POST" style="display:inline;">
                            <button type="submit" class="toggle-btn">{% if task.completed %}Unmark{% else %}Complete{% endif %}</button>
                        </form>
                        <span class="task-desc">{{ task.description }}</span>
                        <form action="/tasks/{{ task.id }}/delete" method="POST" style="display:inline;">
                            <button type="submit" class="delete-btn">X</button>
                        </form>
                    </li>
                    {% endfor %}
                </ul>

                <form action="/lists/{{ list.id }}/tasks" method="POST" class="task-form">
                    <input type="text" name="description" placeholder="New Task Description" required>
                    <button type="submit">Add Task</button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
