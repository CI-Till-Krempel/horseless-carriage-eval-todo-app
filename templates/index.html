<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do App Dashboard</h1>
    
    <h2>Create List</h2>
    <form action="/list/create" method="POST">
        <input type="text" name="name" placeholder="List Name" required>
        <button type="submit">Create List</button>
    </form>

    <h2>Lists</h2>
    {% for list_id, lst in lists.items() %}
        <div>
            <h3>{{ lst.name }}</h3>
            <form action="/list/{{ list_id }}/delete" method="POST" style="display:inline;">
                <button type="submit">Delete Entire List</button>
            </form>

            <form action="/list/{{ list_id }}/task/add" method="POST">
                <input type="text" name="description" placeholder="Task description" required>
                <button type="submit">Add Task</button>
            </form>

            <ul>
                {% for task in tasks.get(list_id, []) %}
                    <li>
                        <span style="{% if task.completed %}text-decoration: line-through; color: gray;{% endif %}">
                            {{ task.description }}
                        </span>
                        <form action="/list/{{ list_id }}/task/{{ task.id }}/toggle" method="POST" style="display:inline;">
                            <button type="submit">{% if task.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}</button>
                        </form>
                        <form action="/list/{{ list_id }}/task/{{ task.id }}/delete" method="POST" style="display:inline;">
                            <button type="submit">Delete</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</body>
</html>
