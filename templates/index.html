<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="title" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>
    <ul>
        {% for lst in lists %}
            <li>{{ lst.title }}</li>
        {% endfor %}
    </ul>
</body>
</html>
