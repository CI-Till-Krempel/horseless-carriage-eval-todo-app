<!doctype html>
<html>
<head>
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do Lists</h1>
    <form action="/lists" method="POST">
        <input type="text" name="name" placeholder="New List Name" required>
        <button type="submit">Create List</button>
    </form>

    {% for l in lists %}
        <div>
            <h2>{{ l.name }}</h2>
            <form action="/lists/{{ l.id }}/delete" method="POST" style="display:inline;">
                <button type="submit">Delete List</button>
            </form>
            <form action="/lists/{{ l.id }}/tasks" method="POST">
                <input type="text" name="title" placeholder="New Task Description" required>
                <button type="submit">Add Task</button>
            </form>
            <ul>
                {% for t in tasks if t.list_id == l.id %}
                    <li>
                        <span style="{% if t.completed %}text-decoration: line-through; color: gray;{% endif %}">
                            {{ t.title }}
                        </span>
                        <form action="/tasks/{{ t.id }}/toggle" method="POST" style="display:inline;">
                            <button type="submit">{% if t.completed %}Mark Incomplete{% else %}Mark Complete{% endif %}</button>
                        </form>
                        <form action="/tasks/{{ t.id }}/delete" method="POST" style="display:inline;">
                            <button type="submit">Delete Task</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        </div>
    {% endfor %}
</body>
</html>
